name: bench-arm64
# Manual only: bench/run_all.sh (micro, macro, parity, Metric A kernels, Metric B agent loop with and without prefetch)
# on GitHub's hosted Arm runner and, for Arm against x86, its x86 runner. Both install the same pinned
# opencv-python-headless version from uv.lock (each architecture's own wheel of it; provenance quotes its build lines).
# These are GitHub Actions VMs, not the deployed Lambda, and the JSON says so (provenance.label). The segmenter rows
# time the classical engine: the dacl10k ONNX files are not in the repository, so no trained-model DNN row runs here.
# Run and fetch: docs/bench.md ("Arm against x86 on GitHub").
# The optional `engines` job (input engines=true) fetches the v1 weights from the public v1.1.0 release instead and runs
# bench/opencv5_engines.py on both runners: docs/bench.md ("OpenCV 5 DNN engines for v1").
on:
  workflow_dispatch:
    inputs:
      n:
        description: images for the macro run (data/synth200 is built here)
        default: "200"
      bench:
        description: run bench/run_all.sh (the job above)
        type: boolean
        default: true
      engines:
        description: run bench/opencv5_engines.py on the v1 weights from the v1.1.0 release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bench:
    if: inputs.bench
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arm: linux-aarch64
          - runner: ubuntu-24.04
            arm: linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (the v4 tag on 2026-10-19)
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0 (the v6 tag on 2026-10-19)
      - run: uv sync --all-extras --locked
      - run: bash bench/run_all.sh ${{ matrix.arm }}
        env:
          N: ${{ inputs.n }}
          KERNEL_THREADS: "1,all"
          LOOP_THREADS: "1,2,4"
          BENCH_LABEL: GitHub ${{ matrix.runner }} runner, not Lambda
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (the v4 tag on 2026-10-19)
        with:
          name: bench-${{ matrix.arm }}
          path: |
            results/${{ matrix.arm }}/micro.json
            results/${{ matrix.arm }}/macro.json
            results/${{ matrix.arm }}/kernels.json
            results/${{ matrix.arm }}/loop.json
          if-no-files-found: error

  engines:
    # Which OpenCV 5 DNN engine reads v1, its forward latency and parity (bench/opencv5_engines.py). The CC BY-NC 4.0
    # weights come from the public release, checked against its sha256 file and against the hashes committed in
    # models/drishyam_dacl10k.provenance.json; only the JSON is uploaded, never the weights.
    if: inputs.engines
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arm: linux-aarch64
          - runner: ubuntu-24.04
            arm: linux-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (the v4 tag on 2026-10-19)
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0 (the v6 tag on 2026-10-19)
      - run: uv sync --all-extras --locked
      - name: v1 weights from the v1.1.0 release, sha256-checked
        shell: bash  # -eo pipefail
        run: |
          base=https://github.com/vj-io/drishyam/releases/download/v1.1.0
          for f in drishyam_dacl10k.onnx drishyam_dacl10k.fp16.onnx drishyam_dacl10k.sha256; do
            curl -fsSL --retry 3 -o "models/$f" "$base/$f"
          done
          sha256sum -c models/drishyam_dacl10k.sha256
          jq -r '.sha256 | to_entries[] | "\(.value)  models/\(.key)"' models/drishyam_dacl10k.provenance.json | sha256sum -c
      - run: uv run python -m bench.opencv5_engines --arm ${{ matrix.arm }}
        env:
          BENCH_LABEL: GitHub ${{ matrix.runner }} runner, not Lambda
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (the v4 tag on 2026-10-19)
        with:
          name: opencv5-engines-${{ matrix.arm }}
          path: results/${{ matrix.arm }}/opencv5_engines.json
          if-no-files-found: error
