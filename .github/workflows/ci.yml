name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]  # x86 and Arm (Graviton-class) runners
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run ruff check drishyam app.py tests evals
      - run: uv run python -c "import cv2, platform; print(cv2.__version__, platform.machine())"
      - run: uv run pytest -q --ignore=tests/e2e
