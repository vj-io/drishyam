name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]  # x86 and Arm (Graviton-class) runners
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run ruff check drishyam tests evals training
      - run: uv run python -c "import cv2, platform; print(cv2.__version__, platform.machine())"
      - run: uv run pytest -q --ignore=tests/e2e
      # The CDK synth tests (IAM, Dual Auth, WAF, budget), which the step above skips for want of CDK.
      # The import check makes a missing CDK a failure here, not a skip.
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          uv run --with-requirements infra/requirements.txt python -c "import aws_cdk"
          uv run --with-requirements infra/requirements.txt python -m pytest -q tests/test_infra.py

  e2e-mock:  # the page in a real Chromium under the production CSP, against fixtures and a stand-in API
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --with playwright==1.63.0 playwright install --with-deps chromium
      - run: uv run --no-project --with playwright==1.63.0 python tests/e2e/test_ui_mock.py
        env:
          DRISHYAM_SHOTS: ${{ runner.temp }}/e2e-shots
