[project]
name = "drishyam"
version = "1.0.2"
description = "Virtual-PTZ bridge inspector: decides where to look, zooms until it is sure, and stops when the next look is worth less than it costs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "opencv-python-headless==5.0.0.93",
    "fastapi>=0.140",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
aws = ["boto3>=1.35"]  # DynamoDB kill flags and the Secrets Manager signing key, on AWS Lambda only

[project.scripts]
drishyam = "drishyam.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "onnx>=1.17", "ruff>=0.8", "uvicorn>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drishyam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
